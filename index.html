<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uncharted Land — Minecraft сервер</title>
    <style>
        /* --- Оформление (можно менять по вкусу) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #1a1a2e;
            color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 750px;
            width: 100%;
            background: #16213e;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            text-align: center;
        }
        h1 {
            font-size: 3em;
            color: #f0a500;
            text-shadow: 0 0 20px rgba(240,165,0,0.3);
            margin-bottom: 10px;
        }
        .ip-box {
            background: #0f3460;
            padding: 20px;
            border-radius: 15px;
            margin: 25px 0;
            border: 2px dashed #f0a500;
        }
        .ip {
            font-size: 2em;
            font-weight: bold;
            color: #fff;
            letter-spacing: 2px;
            word-break: break-all;
        }
        .copy-btn {
            background: #f0a500;
            color: #1a1a2e;
            border: none;
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .copy-btn:hover {
            background: #ffb700;
            transform: scale(1.03);
        }
        .donate-list {
            text-align: left;
            background: #0f3460;
            padding: 20px;
            border-radius: 15px;
            margin: 25px 0;
        }
        .donate-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #1a1a2e;
        }
        .donate-item:last-child {
            border-bottom: none;
        }
        .donate-name {
            font-weight: bold;
            color: #f0a500;
        }
        .donate-price {
            color: #7ec8e3;
        }
        .links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin: 20px 0 10px;
        }
        .links a {
            background: #0f3460;
            color: #eee;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 30px;
            transition: 0.3s;
            border: 1px solid #f0a500;
        }
        .links a:hover {
            background: #f0a500;
            color: #1a1a2e;
        }
        .footer {
            margin-top: 20px;
            font-size: 0.9em;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- Название сервера -->
        <h1>🏰 Uncharted Land</h1>
        <p style="font-size: 1.2em; opacity: 0.8;">Приключения ждут тебя!</p>

        <!-- IP адрес -->
        <div class="ip-box">
            <div class="ip" id="server-ip">mc.unchartedland.ru</div>
            <button class="copy-btn" onclick="copyIP()">📋 Скопировать IP</button>
        </div>

        <!-- Донатные услуги -->
        <h2 style="color: #f0a500; margin-bottom: 10px;">🎁 Донатные услуги</h2>
        <div class="donate-list">
            <div class="donate-item">
                <span class="donate-name">🗡️ VIP</span>
                <span class="donate-price">150 ₽</span>
            </div>
            <div class="donate-item">
                <span class="donate-name">👑 Premium</span>
                <span class="donate-price">300 ₽</span>
            </div>
            <div class="donate-item">
                <span class="donate-name">⭐ Legend</span>
                <span class="donate-price">500 ₽</span>
            </div>
            <div class="donate-item">
                <span class="donate-name">💎 Все привилегии +</span>
                <span class="donate-price">1000 ₽</span>
            </div>
        </div>

        <!-- Сообщества -->
        <h2 style="color: #f0a500; margin-bottom: 10px;">🌐 Мы в соцсетях</h2>
        <div class="links">
            <a href="https://t.me/unchartedland" target="_blank">📱 Telegram</a>
            <a href="https://vk.com/unchartedland" target="_blank">📘 ВКонтакте</a>
            <a href="https://discord.gg/unchartedland" target="_blank">💬 Discord</a>
        </div>

        <div class="footer">
            © 2026 Uncharted Land · Все права защищены
        </div>
    </div>

    <script>
        // Функция для копирования IP в буфер обмена
        function copyIP() {
            const ip = document.getElementById('server-ip').innerText;
            navigator.clipboard.writeText(ip).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.textContent = '✅ Скопировано!';
                setTimeout(() => {
                    btn.textContent = '📋 Скопировать IP';
                }, 2500);
            }).catch(err => {
                alert('Не удалось скопировать. Скопируйте вручную: ' + ip);
            });
        }
    </script>
</body>
</html>
